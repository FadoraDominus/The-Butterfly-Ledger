<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Butterfly Ledger 🦋</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Consolas', monospace; color: white; user-select: none; }
        
        /* --- DANGER EFFECTS --- */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); filter: brightness(1.2) contrast(1.2); }
            40% { transform: translate(3px, -3px); filter: hue-rotate(10deg); }
            100% { transform: translate(0); }
        }
        .glitching { animation: glitch 0.2s infinite; }

        @keyframes rainbow { 0% { color: red; } 20% { color: yellow; } 40% { color: green; } 60% { color: blue; } 80% { color: purple; } 100% { color: red; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* --- UI LAYOUT --- */
        .screen { position: fixed; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #loader { display: flex; background: #000; z-index: 2000; }
        #progress-fill { width: 0%; height: 100%; background: #00d4ff; transition: width 0.1s; }

        #menu { display: none; z-index: 1000; backdrop-filter: blur(5px); }
        #roblox-promo { position: absolute; top: 30px; right: 30px; width: 220px; text-align: center; font-size: 0.8em; font-weight: bold; animation: rainbow 3s linear infinite, spin 10s linear infinite; }

        .main-btn { background: transparent; border: 1px solid #fff; color: #fff; padding: 12px 30px; cursor: pointer; font-size: 1.1em; transition: 0.3s; margin: 5px; }
        .main-btn:hover { background: #fff; color: #000; box-shadow: 0 0 20px #fff; }

        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; padding: 40px; box-sizing: border-box; z-index: 10; pointer-events: none; flex-direction: column; justify-content: space-between; }
        .panel { pointer-events: auto; background: rgba(0,0,0,0.95); border: 1px solid #00d4ff; padding: 30px; }
        #outcome-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); display:none; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding: 20px; z-index: 50; }
        
        #stability-val { font-size: 3.5em; font-weight: bold; transition: color 0.5s; color: #00ffcc; }
        #music-container { position: absolute; left: -9999px; visibility: hidden; }
    </style>
</head>
<body id="main-body">

    <div id="music-container">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&mute=0&loop=1&playlist=jfKfPfyJRdk" frameborder="0" allow="autoplay"></iframe>
    </div>

    <div id="loader" class="screen">
        <div style="letter-spacing: 5px; font-weight: bold;">SYNCHRONIZING GLOBAL DATA...</div>
        <div style="width: 300px; height: 2px; background: #222; margin-top: 20px;"><div id="progress-fill"></div></div>
        <div style="margin-top: 30px; opacity: 0.6; font-size: 0.8em;">Credits to - Ashen(@ashenthegreat3992)</div>
    </div>

    <div id="menu" class="screen">
        <div id="roblox-promo">Go follow the creator of this website on roblox, darkco281110!</div>
        <h1 style="font-size: 4em; letter-spacing: 12px; margin-bottom: 0;">THE BUTTERFLY LEDGER</h1>
        <div style="color: #666; margin-bottom: 40px; font-style: italic;">"Realistic Policy. Chaotic Results."</div>
        <button class="main-btn" onclick="triggerIntroFlow()">START SIMULATION</button>
    </div>

    <div id="intro" class="screen">
        <div id="intro-text-box" style="font-size: 1.6em; text-align: center; max-width: 600px; line-height: 1.5;"></div>
    </div>

    <div id="game-ui">
        <div class="panel" id="main-panel" style="width: 500px;">
            <div id="shift-label" style="color: #00d4ff; font-size: 0.8em; margin-bottom: 10px; font-weight: bold;">POLICY NODE</div>
            <div id="scenario-text" style="min-height: 100px; font-size: 1.3em; line-height: 1.4;">Connecting...</div>
            <div style="display:flex; gap:15px; margin-top:20px;">
                <button class="main-btn" style="flex:1; border-color:#00ff00;" onclick="handleChoice(true)">APPROVE</button>
                <button class="main-btn" style="flex:1; border-color:#ff0000;" onclick="handleChoice(false)">DENY</button>
            </div>
            <div id="outcome-overlay">
                <div id="outcome-status" style="font-size: 1.8em; font-weight: bold; margin-bottom: 10px;"></div>
                <div id="outcome-desc" style="color: #ccc; font-size: 1.1em; max-width: 400px;"></div>
            </div>
        </div>
        <div class="panel" style="width: 220px; text-align: right; align-self: flex-end;">
            <div style="font-size: 0.9em; color: #00d4ff; letter-spacing: 2px;">STABILITY INDEX</div>
            <div id="stability-val">100%</div>
        </div>
    </div>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 100% REALISTIC ASSETS ---
        const subjects = [
            "A logistics firm", "The City Council", "A real estate developer", "A national labor union", 
            "The Department of Transit", "A local school board", "A tech conglomerate", "An urban planning committee", 
            "A retail giant", "A farmers' cooperative", "A public health agency", "The regional power grid",
            "A massive hotel chain", "A civil engineering firm", "A city-wide recycling non-profit"
        ];

        const actions = [
            "expand the main suburban highway by four lanes",
            "replace all downtown traffic lights with roundabouts",
            "implement a mandatory 4-day work week for city employees",
            "convert the vacant shopping mall into low-income housing",
            "increase the local sales tax by 2% for public transit",
            "outlaw all single-use plastic bags in grocery stores",
            "install automated speed cameras in every school zone",
            "subsidize the transition to electric delivery trucks",
            "privatize the city's public water filtration system",
            "mandate that all new buildings include rooftop gardens",
            "tax all vacant commercial properties at double the rate",
            "deregulate the height limits for downtown skyscrapers",
            "ban all cars from the historic district after 6:00 PM",
            "build a bridge connecting the industrial park to the suburbs",
            "replace all city-owned gas vehicles with hybrid alternatives"
        ];

        const goods = [
            "Traffic congestion cleared; commute times were halved.",
            "Accidents dropped by 60% in high-traffic intersections.",
            "Worker morale peaked; city services became more efficient.",
            "Homelessness dropped; the downtown area saw a revival.",
            "The new subway line was finished ahead of schedule.",
            "Local landfills saw a massive reduction in daily waste.",
            "School zones became significantly safer for children.",
            "Air quality in the city reached its cleanest in decades.",
            "Water quality improved; utility costs for citizens dropped.",
            "City temperatures cooled; energy bills fell for everyone.",
            "Small businesses moved in; the local economy boomed.",
            "The city skyline became a world-class architectural marvel.",
            "The district became a thriving hub for dining and tourism.",
            "Industrial shipping costs fell; 2,000 new jobs were created.",
            "Carbon emissions dropped; fuel costs for the city vanished."
        ];

        const bads = [
            "The construction caused a permanent 2-year gridlock.",
            "Confusion led to a record-high number of vehicle pile-ups.",
            "City services slowed to a crawl; budget deficits grew.",
            "The mall became an unsafe, overcrowded concrete cage.",
            "Consumer spending plummeted; local shops went bankrupt.",
            "Small stores struggled; packaging costs soared for families.",
            "The cameras were hacked, leaking location data of citizens.",
            "The grid failed under the sudden demand for charging.",
            "Water prices tripled; the private firm cut off low-income areas.",
            "Maintenance costs soared; buildings suffered structural leaks.",
            "Property owners fled the city, leaving blocks abandoned.",
            "The skyscrapers blocked all sunlight, killing city parks.",
            "Business owners lost 50% of revenue; the district died.",
            "The bridge collapsed due to poor soil, costing billions.",
            "The hybrid battery disposal created a toxic soil crisis."
        ];

        function generateRealisticScenarios(count) {
            let list = [];
            for(let i=0; i<count; i++) {
                let sIdx = Math.floor(Math.random() * subjects.length);
                let aIdx = Math.floor(Math.random() * actions.length);
                list.push({
                    text: `${subjects[sIdx]} wants to ${actions[aIdx]}.`,
                    pos: goods[aIdx],
                    neg: bads[aIdx]
                });
            }
            return list.sort(() => Math.random() - 0.5);
        }

        const Scenarios = generateRealisticScenarios(200);
        let state = { idx: 0, stability: 100, isProcessing: false };

        // --- THREE.JS ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const core = new THREE.Mesh(new THREE.IcosahedronGeometry(2, 1), new THREE.MeshBasicMaterial({ color: 0x00d4ff, wireframe: true }));
        scene.add(core);
        camera.position.z = 6;

        function triggerFireball() {
            const fb = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4500 }));
            fb.position.set(Math.random()*12-6, 8, -5);
            scene.add(fb);
            const start = performance.now();
            function move(now) {
                const p = (now - start) / 500;
                if (p < 1) { fb.position.lerp(new THREE.Vector3(0,0,0), p); requestAnimationFrame(move); }
                else { scene.remove(fb); }
            }
            requestAnimationFrame(move);
        }

        window.triggerIntroFlow = () => {
            document.getElementById('menu').style.display = 'none';
            const intro = document.getElementById('intro');
            const box = document.getElementById('intro-text-box');
            intro.style.display = 'flex';
            const lines = ["Keeper, welcome.", "Simulating real-world variables.", "Stability is a 50/50 gamble.", "One choice can break the city."];
            let cur = 0;
            const cycle = setInterval(() => {
                box.innerText = lines[cur++];
                if(cur > lines.length) { clearInterval(cycle); intro.style.display = 'none'; startFlow(); }
            }, 2500);
        };

        window.startFlow = () => {
            document.getElementById('game-ui').style.display = 'flex';
            updateUI();
        };

        window.handleChoice = (approved) => {
            if(state.isProcessing) return;
            state.isProcessing = true;
            
            // --- PURE 50/50 LOGIC ---
            const isGoodOutcome = Math.random() > 0.5;
            const correct = (approved && isGoodOutcome) || (!approved && !isGoodOutcome);
            if(!correct) triggerFireball();

            const s = Scenarios[state.idx];
            const overlay = document.getElementById('outcome-overlay');
            overlay.style.display = 'flex';
            document.getElementById('outcome-status').innerText = correct ? "SYSTEM STABLE" : "SOCIETAL FRACTURE";
            document.getElementById('outcome-status').style.color = correct ? "#00ff00" : "#ff0000";
            document.getElementById('outcome-desc').innerText = correct ? s.pos : s.neg;

            setTimeout(() => {
                overlay.style.display = 'none';
                state.stability = Math.max(0, Math.min(100, state.stability + (correct ? 5 : -15)));
                state.idx++;
                updateUI();
                state.isProcessing = false;
            }, 2500);
        };

        function updateUI() {
            const s = Scenarios[state.idx];
            document.getElementById('scenario-text').innerText = s.text;
            const stabEl = document.getElementById('stability-val');
            stabEl.innerText = state.stability + "%";
            
            if (state.stability > 75) stabEl.style.color = "#00ffcc";
            else if (state.stability > 40) stabEl.style.color = "#ffcc00";
            else stabEl.style.color = "#ff0000";

            if (state.stability < 30) {
                document.getElementById('main-body').classList.add('glitching');
                core.material.color.set(0xff0000);
            } else {
                document.getElementById('main-body').classList.remove('glitching');
                core.material.color.set(0x00d4ff);
            }

            if(state.stability <= 0) { alert("SOCIAL ORDER COLLAPSED. THE SIMULATION HAS ENDED."); location.reload(); }
        }

        let lp = 0;
        const li = setInterval(() => {
            lp += 10;
            document.getElementById('progress-fill').style.width = lp + "%";
            if(lp >= 100) { clearInterval(li); document.getElementById('loader').style.display = 'none'; document.getElementById('menu').style.display = 'flex'; }
        }, 60);

        function animate() {
            requestAnimationFrame(animate);
            core.rotation.y += (state.stability < 30 ? 0.08 : 0.015);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
