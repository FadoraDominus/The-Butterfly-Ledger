<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Butterfly Ledger 🦋</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Consolas', monospace; color: white; user-select: none; }
        
        /* --- GLITCH & ANIMATIONS --- */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); filter: hue-rotate(90deg); }
            40% { transform: translate(3px, -3px); filter: invert(0.2); }
            60% { transform: translate(-3px, -1px); }
            100% { transform: translate(0); }
        }
        .glitching { animation: glitch 0.15s infinite; }

        @keyframes rainbow { 0% { color: red; } 20% { color: yellow; } 40% { color: green; } 60% { color: blue; } 80% { color: purple; } 100% { color: red; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* --- UI --- */
        .screen { position: fixed; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #loader { display: flex; background: #000; z-index: 2000; }
        #progress-fill { width: 0%; height: 100%; background: #00d4ff; transition: width 0.1s; }

        #menu { display: none; z-index: 1000; backdrop-filter: blur(5px); }
        #roblox-promo { position: absolute; top: 30px; right: 30px; width: 220px; text-align: center; font-size: 0.8em; font-weight: bold; animation: rainbow 3s linear infinite, spin 10s linear infinite; }

        .main-btn { background: transparent; border: 1px solid #fff; color: #fff; padding: 12px 30px; cursor: pointer; font-size: 1.1em; transition: 0.3s; margin: 5px; }
        .main-btn:hover { background: #fff; color: #000; box-shadow: 0 0 20px #fff; }

        /* GAMEPLAY UI */
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; padding: 40px; box-sizing: border-box; z-index: 10; pointer-events: none; flex-direction: column; justify-content: space-between; }
        .panel { pointer-events: auto; background: rgba(0,0,0,0.85); border: 1px solid #00d4ff; padding: 30px; }
        #outcome-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); display:none; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding: 20px; z-index: 50; }
        
        #stability-val { font-size: 3em; font-weight: bold; transition: color 0.5s; color: #00ffcc; }
        #music-container { position: absolute; left: -9999px; visibility: hidden; }
    </style>
</head>
<body id="main-body">

    <div id="music-container">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&mute=0&loop=1&playlist=jfKfPfyJRdk" frameborder="0" allow="autoplay"></iframe>
    </div>

    <div id="loader" class="screen">
        <div style="letter-spacing: 5px;">SHUFFLING TIMELINES...</div>
        <div style="width: 300px; height: 2px; background: #222; margin-top: 20px;"><div id="progress-fill"></div></div>
        <div style="margin-top: 30px; opacity: 0.6; font-size: 0.8em;">Credits to - Ashen(@ashenthegreat3992)</div>
    </div>

    <div id="menu" class="screen">
        <div id="roblox-promo">Go follow the creator of this website on roblox, darkco281110!</div>
        <h1 style="font-size: 4em; letter-spacing: 12px; margin-bottom: 0;">THE BUTTERFLY LEDGER</h1>
        <div style="color: #666; margin-bottom: 40px;">btw this is a decision making game :)</div>
        <button class="main-btn" onclick="triggerIntroFlow()">PLAY</button>
    </div>

    <div id="intro" class="screen">
        <div id="intro-text-box" style="font-size: 1.6em; text-align: center;"></div>
    </div>

    <div id="game-ui">
        <div class="panel" id="main-panel" style="width: 450px;">
            <div id="shift-label" style="color: #00d4ff; font-size: 0.8em; margin-bottom: 10px;">SHIFT 1</div>
            <div id="scenario-text" style="min-height: 80px; font-size: 1.2em;">Connecting...</div>
            <div style="display:flex; gap:15px; margin-top:20px;">
                <button class="main-btn" style="flex:1; border-color:#00ff00;" onclick="handleChoice(true)">APPROVE</button>
                <button class="main-btn" style="flex:1; border-color:#ff0000;" onclick="handleChoice(false)">DENY</button>
            </div>
            <div id="outcome-overlay">
                <div id="outcome-status" style="font-size: 1.5em; font-weight: bold; margin-bottom: 10px;"></div>
                <div id="outcome-desc" style="color: #ccc;"></div>
            </div>
        </div>
        <div class="panel" style="width: 200px; text-align: right; align-self: flex-end;">
            <div style="font-size: 0.8em; color: #00d4ff;">STABILITY</div>
            <div id="stability-val">100%</div>
        </div>
    </div>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>

    <script type="module">
        import * as THREE from 'three';

        // --- IMPROVED SCENARIO GENERATOR ---
        const subjects = ["A Baker", "A Rogue AI", "A Scientist", "A Child", "A Time Traveler", "A Cultist", "A Ghost", "A Politician", "An Alien", "A Robot"];
        const actions = ["lower bread prices", "re-route the power grid", "release bio-bees", "plant a star-seed", "rewrite yesterday", "open a dark portal", "haunt the library", "ban all colors", "land their saucer", "upload the city"];
        const goods = ["The people were fed and happy.", "Energy became free for everyone.", "Nature flourished instantly.", "A beautiful crystal tree grew.", "A major war was avoided.", "Forbidden knowledge was safely stored.", "The city gained a wise guardian.", "Society became peaceful.", "They shared advanced medicine.", "Humanity reached a digital utopia."];
        const bads = ["The economy collapsed into dust.", "A massive city-wide blackout occurred.", "The bees caused a glowing plague.", "The seed sprouted a monster.", "Tomorrow was accidentally erased.", "Demons flooded the streets.", "Everyone lost their ability to sleep.", "The world turned grey and hopeless.", "They began the harvesting process.", "The server crashed, killing millions."];

        function generateScenarios(count) {
            let list = [];
            for(let i=0; i<count; i++) {
                let subIdx = Math.floor(Math.random() * subjects.length);
                let actIdx = Math.floor(Math.random() * actions.length);
                list.push({
                    text: `${subjects[subIdx]} wants to ${actions[actIdx]}.`,
                    pos: goods[actIdx], // Matches the action's positive outcome
                    neg: bads[actIdx],  // Matches the action's negative outcome
                    chance: Math.random() * 0.6 + 0.2 // Random risk between 20% and 80%
                });
            }
            return list.sort(() => Math.random() - 0.5); // SHUFFLE THE ENTIRE LIST
        }

        const Scenarios = generateScenarios(200);
        let state = { idx: 0, stability: 100, isProcessing: false };

        // --- THREE.JS ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const core = new THREE.Mesh(new THREE.IcosahedronGeometry(2, 1), new THREE.MeshBasicMaterial({ color: 0x00d4ff, wireframe: true }));
        scene.add(core);
        camera.position.z = 6;

        function triggerFireball() {
            const fb = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4500 }));
            fb.position.set(Math.random()*10-5, 8, -5);
            scene.add(fb);
            const start = performance.now();
            function move(now) {
                const p = (now - start) / 500;
                if (p < 1) { fb.position.lerp(new THREE.Vector3(0,0,0), p); requestAnimationFrame(move); }
                else { scene.remove(fb); }
            }
            requestAnimationFrame(move);
        }

        window.triggerIntroFlow = () => {
            document.getElementById('menu').style.display = 'none';
            const intro = document.getElementById('intro');
            const box = document.getElementById('intro-text-box');
            intro.style.display = 'flex';
            const lines = ["Welcome, Keeper.", "Reality has been shuffled.", "No two journeys are the same.", "Watch the Core."];
            let cur = 0;
            const cycle = setInterval(() => {
                box.innerText = lines[cur++];
                if(cur > lines.length) { clearInterval(cycle); intro.style.display = 'none'; startFlow(); }
            }, 2500);
        };

        window.startFlow = () => {
            document.getElementById('game-ui').style.display = 'flex';
            updateUI();
        };

        window.handleChoice = (approved) => {
            if(state.isProcessing) return;
            state.isProcessing = true;
            const s = Scenarios[state.idx];
            const isGood = Math.random() < s.chance;
            const correct = (approved && isGood) || (!approved && !isGood);

            if(!correct) triggerFireball();

            const overlay = document.getElementById('outcome-overlay');
            overlay.style.display = 'flex';
            document.getElementById('outcome-status').innerText = correct ? "STABLE" : "FRACTURED";
            document.getElementById('outcome-status').style.color = correct ? "#00ff00" : "#ff0000";
            document.getElementById('outcome-desc').innerText = correct ? s.pos : s.neg;

            setTimeout(() => {
                overlay.style.display = 'none';
                state.stability = Math.max(0, Math.min(100, state.stability + (correct ? 5 : -15)));
                state.idx++;
                updateUI();
                state.isProcessing = false;
            }, 2500);
        };

        function updateUI() {
            const s = Scenarios[state.idx];
            document.getElementById('scenario-text').innerText = s.text;
            const stabEl = document.getElementById('stability-val');
            stabEl.innerText = state.stability + "%";
            
            // STABILITY COLOR
            if (state.stability > 70) stabEl.style.color = "#00ffcc";
            else if (state.stability > 30) stabEl.style.color = "#ffcc00";
            else stabEl.style.color = "#ff0000";

            // GLITCH EFFECT
            if (state.stability < 25) {
                document.getElementById('main-body').classList.add('glitching');
                core.material.color.set(0xff0000);
            } else {
                document.getElementById('main-body').classList.remove('glitching');
                core.material.color.set(0x00d4ff);
            }

            if(state.stability <= 0) { alert("REALITY COLLAPSED"); location.reload(); }
        }

        let lp = 0;
        const li = setInterval(() => {
            lp += 10;
            document.getElementById('progress-fill').style.width = lp + "%";
            if(lp >= 100) { clearInterval(li); document.getElementById('loader').style.display = 'none'; document.getElementById('menu').style.display = 'flex'; }
        }, 80);

        function animate() {
            requestAnimationFrame(animate);
            core.rotation.y += (state.stability < 30 ? 0.05 : 0.01);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
